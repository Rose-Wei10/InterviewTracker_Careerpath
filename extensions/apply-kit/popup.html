<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Careerpath Apply Kit</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Apply Kit</h1>
    <label for="bundle">Paste autofill data from Careerpath</label>
    <textarea
      id="bundle"
      rows="3"
      autocomplete="off"
      spellcheck="false"
    ></textarea>
    <button id="scan" type="button">Scan this page</button>
    <p id="status" role="status"></p>
    <section id="fields" aria-label="Field suggestions"></section>
    <button id="fill" type="button" disabled>Fill selected</button>
    <script type="module" src="popup.mjs"></script>
  </body>
</html>
