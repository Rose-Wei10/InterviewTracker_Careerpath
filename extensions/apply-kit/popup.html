<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Careerpath Apply Kit</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <p class="brand">Careerpath</p>
      <h1>Apply Kit</h1>
      <p>Review saved answers for this application.</p>
    </header>
    <main>
      <section class="card">
        <div id="import">
          <label for="bundle">Paste autofill data from Careerpath</label>
          <textarea
            id="bundle"
            rows="3"
            autocomplete="off"
            spellcheck="false"
          ></textarea>
        </div>
        <div id="loaded" class="bar" hidden>
          <strong id="summary"></strong
          ><button id="replace" type="button">Replace</button>
        </div>
        <button id="scan" type="button">Scan this page</button>
      </section>
      <p id="status" role="status"></p>
      <section class="card" aria-label="Scan diagnostics">
        <strong>Scan details</strong>
        <p id="diagnostics">Autofill data not loaded. No tab scanned.</p>
      </section>
      <section id="fields" aria-label="Field suggestions"></section>
      <section id="checklist" class="card" hidden></section>
      <details id="track" class="card" hidden>
        <summary>Record an application after submission</summary>
        <label for="job-link">Original job link</label>
        <input id="job-link" type="url" />
        <label
          ><input id="confirmed" type="checkbox" /> The employer confirmed
          submission</label
        >
        <button id="record" type="button" disabled>
          Check Careerpath for duplicates
        </button>
      </details>
    </main>
    <footer class="bar">
      <span id="count">0 selected</span
      ><button id="fill" class="primary" type="button" disabled>
        Fill selected
      </button>
    </footer>
    <script type="module" src="popup.mjs"></script>
  </body>
</html>
